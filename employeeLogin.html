<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee Login</title>

    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="app-header">

    <div class="header-overlay"></div>

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="WaveNxD Logo"
        >

        <div class="company-text">

            <h1>
                WaveNxD Technologies Pvt. Ltd.
            </h1>

            <p>
                Office Attendance Management System
            </p>

        </div>

    </div>

</header>

<div class="login-container">

    <!-- Left Panel -->

    <div class="login-left">

        <h2>Employee Portal</h2>

        <p>
            Welcome Back!
        </p>

        <br><br>

        <div
            style="
                text-align: left;
                line-height: 2;
                font-size: 18px;
            "
        >

            ✅ Daily Attendance<br>

            ✅ Attendance History<br>

            ✅ Change Password<br>

            ✅ Monthly Report

        </div>

    </div>

    <!-- Right Panel -->

    <div class="login-right">

        <h2
            style="
                margin-bottom: 30px;
                color: #0B3D91;
            "
        >
            Welcome Employee 👋
        </h2>

        <label for="employeeId">
            Employee ID
        </label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            autocomplete="username"
        >

        <br><br>

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="current-password"
        >

        <br><br>

        <button
            type="button"
            id="loginBtn"
            class="login-btn"
        >
            🔓 Login
        </button>

       

        <button
            type="button"
            onclick="location.href='index.html'"
            class="back-btn"
        >
            ← Back
        </button>

    </div>

</div>

<script
    type="module"
    src="js/employeeLogin.js"
></script>

<footer class="footer">

    <p>
        © 2026 Version 1.0
        &nbsp; | &nbsp;
        Developed by <strong>OM S PATIL</strong>
    </p>

</footer>

</body>

</html>
