<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leave Requests</title>

    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="app-header">

    <div class="header-overlay"></div>

    <div class="header-content">

        <img
            src="images/logo.png"
            class="logo"
            alt="Company Logo"
        >

        <div class="company-text">

            <h1>
                WaveNxD Technologies Pvt. Ltd.
            </h1>

            <p>
                Office Attendance Management System
            </p>

        </div>

    </div>

</header>

<div class="container">

    <h2>📝 Leave Requests</h2>

    <hr>

    <br>

    <!-- Company Filter -->

    <label for="companyFilter">
        <strong>Select Company</strong>
    </label>

    <br><br>

    <select id="companyFilter">

        <option value="All">
            All Companies
        </option>

        <option value="WaveNxD">
            WaveNxD
        </option>

        <option value="Nexa Prime">
            Nexa Prime
        </option>

    </select>

    <br><br>

    <!-- Leave Requests Table -->

    <div class="table-container">

        <table id="leaveRequestsTable">

            <thead>

                <tr>

                    <th>Employee ID</th>

                    <th>Name</th>

                    <th>Type</th>

                    <th>Company</th>

                    <th>Leave Date</th>

                    <th>Reason</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="leaveTable">

                <tr>

                    <td colspan="8">
                        Loading leave requests...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <br>

    <button
        type="button"
        onclick="location.href='adminDashboard.html'"
    >
        ⬅ Back
    </button>

</div>

<script
    type="module"
    src="js/adminLeaveRequests.js"
></script>

<footer class="footer">

    <p>
        © 2026 Version 1.0
        &nbsp; | &nbsp;
        Developed by <strong>OM S PATIL</strong>
    </p>

</footer>

</body>

</html>
